<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARXYLVE — Aperçu des appareils</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080b10;color:#e5e7ee;font:14px system-ui,sans-serif;height:100dvh;display:flex;flex-direction:column;overflow:hidden}header{padding:16px 22px;display:flex;flex-wrap:wrap;align-items:center;gap:14px;background:linear-gradient(120deg,#351c2e70,#14254360);border-bottom:1px solid #ffffff18}strong{letter-spacing:.12em;margin-right:auto}nav{display:flex;flex-wrap:wrap;gap:6px}button{font:inherit;color:inherit;cursor:pointer;background:linear-gradient(150deg,#ffffff12,#101623);border:1px solid #acb8cf38;border-radius:30px;padding:9px 14px;min-height:40px}button[aria-pressed=true]{background:linear-gradient(130deg,#622746b0,#203962b0);border-color:#bca5bc80}button:focus-visible{outline:2px solid #c9bdd4;outline-offset:2px}.pages{padding:10px 22px;display:flex;align-items:center;flex-wrap:wrap;gap:8px}.pages span{margin-left:auto;color:#afb8ca;font-size:12px}main{flex:1;min-height:0;display:grid;place-items:center;overflow:hidden;padding:14px;background:radial-gradient(ellipse at 10% 50%,#4a192c35,transparent 55%),radial-gradient(ellipse at 95% 70%,#103f2b26,transparent 50%)}.device{border:1px solid #a7b6d144;border-radius:28px;background:#000;box-shadow:0 16px 60px #0008;position:relative;padding:8px;flex:none}.viewport{overflow:hidden;position:relative;border-radius:20px}iframe{display:block;border:0;transform-origin:top left;background:#06080c}footer{padding:8px 22px 12px;color:#a2adbf;font-size:12px;text-align:center}#notice{color:#ded0a8} @media(max-width:650px){header{padding:10px;gap:8px}strong{width:100%}.pages{padding:8px}button{padding:8px 10px;font-size:12px}main{padding:6px}footer{font-size:11px}}
</style></head><body>
<header><strong>ARXYLVE · APERÇU</strong><nav aria-label="Appareil"><button data-device="desktop">Ordinateur</button><button data-device="ipad">iPad</button><button data-device="phone">Smartphone</button><button id="rotate" aria-label="Changer l’orientation">Pivoter</button></nav></header>
<div class="pages"><nav aria-label="Page"><button data-path="/">Accueil</button><button data-path="/collection">Collection</button><button data-path="/sur-mesure">Sur mesure</button><button data-path="/a-propos">À propos</button><button data-path="/panier">Panier</button></nav><span id="size"></span></div>
<main><div class="device"><div class="viewport"><iframe title="Aperçu interactif du site ARXYLVE" sandbox="allow-scripts allow-same-origin" src="/"></iframe></div></div></main>
<footer>Version en direct : les modifications du site apparaissent ici. <span id="notice">Les formulaires sont consultables sans envoyer d’e-mail.</span></footer>
<script>
const frame=document.querySelector('iframe'),main=document.querySelector('main'),shell=document.querySelector('.device'),viewport=document.querySelector('.viewport');
const sizes={desktop:[1440,900],ipad:[820,1180],phone:[390,844]};let device=new URLSearchParams(location.search).get('device')||'phone';if(!sizes[device])device='phone';let rotated=false;
function resize(){let [w,h]=sizes[device];if(rotated)[w,h]=[h,w];const scale=Math.min(1,(main.clientWidth-44)/w,(main.clientHeight-44)/h);frame.style.width=w+'px';frame.style.height=h+'px';frame.style.transform='scale('+scale+')';viewport.style.width=w*scale+'px';viewport.style.height=h*scale+'px';shell.style.width=w*scale+18+'px';shell.style.height=h*scale+18+'px';document.querySelector('#size').textContent=w+' × '+h+' · '+Math.round(scale*100)+' %';document.querySelectorAll('[data-device]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.device===device)));document.querySelector('#rotate').setAttribute('aria-pressed',String(rotated));}
document.querySelectorAll('[data-device]').forEach(b=>b.onclick=()=>{device=b.dataset.device;rotated=false;resize();history.replaceState(null,'','?device='+device)});document.querySelector('#rotate').onclick=()=>{rotated=!rotated;resize()};document.querySelectorAll('[data-path]').forEach(b=>b.onclick=()=>frame.src=b.dataset.path);
function highlight(){try{document.querySelectorAll('[data-path]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.path===frame.contentWindow.location.pathname)))}catch{}}
frame.addEventListener('load',()=>{const win=frame.contentWindow;const doc=frame.contentDocument;if(!doc)return;const style=doc.createElement('style');style.textContent='.admin-shortcut,nextjs-portal{display:none!important}';doc.head.append(style);win.addEventListener('submit',e=>{e.preventDefault();e.stopImmediatePropagation();document.querySelector('#notice').textContent='Aperçu uniquement : aucun e-mail n’a été envoyé.'},true);win.addEventListener('click',e=>{const link=e.target.closest?.('a');if(link){const url=new URL(link.href);if(url.origin!==location.origin||url.pathname.startsWith('/admin')||url.pathname==='/apercu'){e.preventDefault();e.stopImmediatePropagation()}}},true);highlight()});new ResizeObserver(resize).observe(main);setInterval(highlight,1000);resize();
</script></body></html>
